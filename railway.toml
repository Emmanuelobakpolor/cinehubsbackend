[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt"

[deploy]
preDeploy = "python manage.py migrate && python manage.py collectstatic --noinput"
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 600 --workers 2 --worker-class gthread --threads 4"
restartPolicyType = "on_failure"
