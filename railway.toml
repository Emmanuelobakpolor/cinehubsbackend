[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt"

[deploy]
# migrate runs on every boot (not as a pre-deploy step) so a deploy can never
# go live with unapplied migrations.
startCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 600 --workers 2 --worker-class gthread --threads 4"
restartPolicyType = "on_failure"
