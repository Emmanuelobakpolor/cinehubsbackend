[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt"

[deploy]
# Railway only recognises `preDeployCommand`; it runs in a throwaway container,
# so collectstatic stays in startCommand where whitenoise can see the files.
preDeployCommand = ["python manage.py migrate --noinput"]
startCommand = "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 600 --workers 2 --worker-class gthread --threads 4"
restartPolicyType = "on_failure"
